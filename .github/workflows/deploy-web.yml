# Runs the tests, exports the web build and publishes it to GitHub Pages.
name: Deploy web build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and web export template
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          templates=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$templates"
          unzip -q -j "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            templates/version.txt templates/web_nothreads_release.zip -d "$templates"

      - name: Import project
        run: godot --headless --path project --import

      - name: Run tests
        timeout-minutes: 5
        run: godot --headless --path project --script res://tests/test_runner.gd

      - name: Export web build
        run: |
          mkdir -p etc/build/web
          cd project
          godot --headless --export-release "Web" ../etc/build/web/index.html
          test -f ../etc/build/web/index.wasm

      - uses: actions/upload-pages-artifact@v3
        with:
          path: etc/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
